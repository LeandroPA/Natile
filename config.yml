# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: default

# HTML Language setting
lang: "br"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below

# The output of the plugin can be used below, e.g., {{vars.MediumFollowersCountPlugin}}
plugins:
  - AgeCalculatorPlugin:
      leandro: 08/09/2020

# Google Analytics tracking id
google_analytics_id: G-DV5PGV5TJ9

# HTML Title
title: "Natilê Gourmet"

# Avatar image path
avatar: "./images/logo.png"

# Name section text
name: "Natilê"

# Tagline section text
tagline: >-
    Em breve!
    <br>🛵 Delivery
    <br>📍 Campo Grande - RJ

og:
    url: https://natile.com.br
    title: Natilê | Churros Gourmet
    image: 
        url: https://natile.com.br/social-preview.jpg
        width: 1200
        height: 630
    description: Peça seus churros gourmet favoritos com entrega rápida.
    locale: pt-br
    type: website

twitter:
    url: https://natile.com.br
    title: Natilê | Churros Gourmet
    image: 
        url: https://natile.com.br/social-preview.jpg
        width: 1200
        height: 630
    description: Peça seus churros gourmet favoritos com entrega rápida.
    card: summary_large_image
    site: natile.com.br

